networks:
  fpfssnetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/16
          gateway: 10.50.0.1

services:
  database:
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    image: mariadb:11.1.5
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306" # TODO unmap in prod
    volumes:
      - fpfssdb_data:/var/lib/mysql
    networks:
      fpfssnetwork:
        ipv4_address: 10.50.0.2
    command: mariadbd --max_allowed_packet=256M --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" --log_bin_trust_function_creators=1
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    image: postgres:15
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 4g
        reservations:
          memory: 512m
    volumes:
      - fpfss_postgres_data:/var/lib/postgresql/data
      - ./backups/pgdb:/var/lib/postgresql/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      fpfssnetwork:
        ipv4_address: 10.50.0.3

volumes:
  fpfssdb_data:
  fpfss_postgres_data:
