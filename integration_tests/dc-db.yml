# Provision with run.sh: each invocation owns its network, databases and volumes.
# No host ports, fixed addresses, production env file or Docker socket are used.
services:
  database:
    image: mariadb:11.1.5
    environment:
      MARIADB_ROOT_PASSWORD: test-root-password
      MARIADB_DATABASE: ${FPFSS_TEST_DB_NAME:?Use integration_tests/run.sh}
      MARIADB_USER: fpfss
      MARIADB_PASSWORD: password
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=256M --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION --log_bin_trust_function_creators=1
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - maria-data:/var/lib/mysql
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${FPFSS_TEST_DB_NAME:?Use integration_tests/run.sh}
      POSTGRES_DB: ${FPFSS_TEST_DB_NAME:?Use integration_tests/run.sh}
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migrate-maria:
    image: ${FPFSS_TEST_DB_NAME}-runner
    entrypoint: [migrate]
    command: ["-path=/src/migrations", "-database=mysql://fpfss:password@tcp(database:3306)/${FPFSS_TEST_DB_NAME}", up]
  migrate-postgres:
    image: ${FPFSS_TEST_DB_NAME}-runner
    entrypoint: [migrate]
    command: ["-path=/src/postgres_migrations", "-database=postgres://${FPFSS_TEST_DB_NAME}:password@postgres:5432/${FPFSS_TEST_DB_NAME}?sslmode=disable", up]
  tests:
    image: ${FPFSS_TEST_DB_NAME}-runner
    build:
      context: ..
      dockerfile: integration_tests/Dockerfile
    environment:
      FPFSS_TEST_DB_NAME: ${FPFSS_TEST_DB_NAME:?Use integration_tests/run.sh}
      SUBMISSION_DB_ENGINE: ${SUBMISSION_DB_ENGINE:-mariadb}
    volumes:
      - ${FPFSS_TEST_RESULTS:?Use integration_tests/run.sh}:/results
    init: true
volumes:
  maria-data:
  postgres-data:
networks:
  default:
    internal: true
